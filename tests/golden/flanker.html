<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExpVis Experiment</title>
  <!--
    Generated by ExpVis v1.0.0 on 2026-09-21 | Device: Desktop
    Target: jsPsych v8.3.0
    Editor: https://github.com/leechiushih-blip/expvis (tag v1.0.0)
    Save this file and open it in a browser to run the experiment.
    Docs: https://www.jspsych.org
    Only the jsPsych plugins used by this experiment are loaded below.
  -->
  <script src="https://unpkg.com/jspsych@8.3.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.2.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@2.1.0"></script>
  <link href="https://unpkg.com/jspsych@8.3.0/css/jspsych.css" rel="stylesheet" type="text/css">
</head>
<body>
  <script>
    var jsPsych = initJsPsych({
      experiment_width: 1280,
      on_finish: function() {
        if (window.jatos) {
          jatos.submitResultData(jsPsych.data.get().csv())
            .then(function () { jatos.endStudy(); });
        } else {
          jsPsych.data.displayData();
          jsPsych.data.get().localSave('csv', 'experiment_' + Date.now() + '.csv');
        }
      }
    });

    var timeline = [];

    // ── Instructions (1/3) ──
    var instructions_trial_1 = {
      type: jsPsychHtmlButtonResponse,
      stimulus: '<div style="display:flex;flex-direction:column;align-items:center;gap:1.5em;padding:2em;box-sizing:border-box"><div style="font-size:20px;color:#333333;font-weight:bold">Flanker task<br><br>Five arrows appear. Answer the direction of the MIDDLE one and ignore the others.<br><br>Left → F     Right → J</div></div>',
      choices: ["Start"],
      button_layout: 'grid',
      grid_rows: 1
    };

    var instructions_timeline = {
      timeline: [instructions_trial_1]
    };
    timeline.push(instructions_timeline);

    // ── Trials (2/3) ──
    // The same procedure once per set of values below.
    var trials_variables = [
      {stimulus: '<div style="display:flex;flex-direction:column;align-items:center;gap:1.5em;padding:2em;box-sizing:border-box"><div style="font-size:44px;color:#333333;font-weight:bold">&lt;&lt;&lt;&lt;&lt;</div></div>', data: {correct_response: 'f'}},
      {stimulus: '<div style="display:flex;flex-direction:column;align-items:center;gap:1.5em;padding:2em;box-sizing:border-box"><div style="font-size:44px;color:#333333;font-weight:bold">&gt;&gt;&gt;&gt;&gt;</div></div>', data: {correct_response: 'j'}},
      {stimulus: '<div style="display:flex;flex-direction:column;align-items:center;gap:1.5em;padding:2em;box-sizing:border-box"><div style="font-size:44px;color:#ef4444;font-weight:bold">&gt;&gt;&lt;&gt;&gt;</div></div>', data: {correct_response: 'f'}},
      {stimulus: '<div style="display:flex;flex-direction:column;align-items:center;gap:1.5em;padding:2em;box-sizing:border-box"><div style="font-size:44px;color:#ef4444;font-weight:bold">&lt;&gt;&lt;&lt;&lt;</div></div>', data: {correct_response: 'j'}}
    ];

    var trials_timeline = {
      timeline: [
        {
          type: jsPsychHtmlKeyboardResponse,
          stimulus: jsPsych.timelineVariable('stimulus'),
          choices: ["f","j"],
          data: jsPsych.timelineVariable('data'),
          on_finish: function(data) {
            data.correct = jsPsych.pluginAPI.compareKeys(data.response, data.correct_response);
          }
        }
      ],
      timeline_variables: trials_variables,
      sample: {type: 'without-replacement', size: 2},
      repetitions: 40
    };
    timeline.push(trials_timeline);

    // ── Done (3/3) ──
    var done_trial_1 = {
      type: jsPsychHtmlButtonResponse,
      stimulus: '<div style="display:flex;flex-direction:column;align-items:center;gap:1.5em;padding:2em;box-sizing:border-box"><div style="font-size:20px;color:#333333;font-weight:bold">Thank you — that is the end of the task.</div></div>',
      choices: ["Finish"],
      button_layout: 'grid',
      grid_rows: 1
    };

    var done_timeline = {
      timeline: [done_trial_1]
    };
    timeline.push(done_timeline);

    jsPsych.run(timeline);

  </script>
</body>
</html>
