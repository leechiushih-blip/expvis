<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExpVis Experiment</title>
  <!--
    Generated by ExpVis on 2026-09-14 | Device: Desktop
    Target: jsPsych v8.3.0
    Save this file and open it in a browser to run the experiment.
    Docs: https://www.jspsych.org
    Only the jsPsych plugins used by this experiment are loaded below.
  -->
  <script src="https://unpkg.com/jspsych@8.3.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.2.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@2.1.0"></script>
  <link href="https://unpkg.com/jspsych@8.3.0/css/jspsych.css" rel="stylesheet" type="text/css">
  <style>
.jspsych-display-element { min-height: 720px; }
  </style>
</head>
<body>
  <script>
    var jsPsych = initJsPsych({
      on_finish: function() {
        jsPsych.data.displayData();
      }
    });

    var timeline = [];

    // ── Instructions (1/3) ──
    var instructions_trial_1 = {
      type: jsPsychHtmlButtonResponse,
      stimulus: '<div style="display:flex;flex-direction:column;align-items:center;gap:1.5em;padding:2em;box-sizing:border-box;width:1280px"><div style="font-size:20px;color:#1e293b;font-weight:bold">Welcome to the Flanker task!</div><div style="font-size:16px;color:#333333;font-weight:bold">A row of arrows will appear in the center. Judge the direction of the MIDDLE arrow.<br>If the middle arrow points LEFT (←), press F.<br>If the middle arrow points RIGHT (→), press J.<br>Ignore the flanking arrows. Respond quickly and accurately.</div></div>',
      choices: ["Start Experiment"],
      button_layout: 'grid',
      grid_rows: 1
    };
    timeline.push(instructions_trial_1);

    // ── Trials (2/3) ──
    // Stimulus variants for trials_trial_1
    var trials_trial_1_variants = [
      {stimulus: '<div style="font-size:28px;color:#1a1a2e;font-weight:bold">&lt;&lt;&lt;&lt;&lt;</div>', correct_response: "f"},
      {stimulus: '<div style="font-size:28px;color:#ef4444;font-weight:bold">&gt;&lt;&gt;&lt;&gt;</div>', correct_response: "j"},
      {stimulus: '<div style="font-size:28px;color:#1a1a2e;font-weight:bold">&gt;&gt;&gt;&gt;&gt;</div>', correct_response: "j"},
      {stimulus: '<div style="font-size:28px;color:#ef4444;font-weight:bold">&lt;&gt;&lt;&lt;&gt;</div>', correct_response: "f"},
      {stimulus: '<div style="font-size:28px;color:#22c55e;font-weight:bold">&gt;&gt;&gt;&lt;&gt;</div>', correct_response: "j"},
    ];

    var trials_trial_1 = {
      timeline_variables: trials_trial_1_variants,
      sample: {type: 'with-replacement', size: 1},
      repetitions: 80,
      timeline: [
        {
          type: jsPsychHtmlKeyboardResponse,
          stimulus: '<div style="display:flex;flex-direction:column;align-items:center;gap:1.5em;padding:2em;box-sizing:border-box;width:1280px"><div style="font-size:60px;color:#ccc">+</div></div>',
          choices: 'NO_KEYS',
          trial_duration: 700,
        },
        {
          type: jsPsychHtmlKeyboardResponse,
          stimulus: jsPsych.timelineVariable('stimulus'),
          choices: ["f","j"],
          trial_duration: 1500,
          prompt: '← Press F  → Press J',
          data: {correct_response: jsPsych.timelineVariable('correct_response')},
          on_finish: function(data) {
            data.correct = jsPsych.pluginAPI.compareKeys(data.response, data.correct_response);
          }
        },
        {
          timeline: [{
            type: jsPsychHtmlButtonResponse,
            stimulus: '<div style="font-size:20px;color:#ef4444;font-weight:bold">Press the key according to the rules!</div>',
            choices: ["Continue"],
            trial_duration: 1500
          }],
          conditional_function: function () {
            return !jsPsych.data.get().last(1).values()[0].correct;
          }
        }
      ]
    };
    timeline.push(trials_trial_1);

    var trials_trial_2 = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: '<div style="display:flex;flex-direction:column;align-items:center;gap:1.5em;padding:2em;box-sizing:border-box;width:1280px"><div style="font-size:20px;color:#ef4444;font-weight:bold">Press the key according to the rules!</div></div>',
      trial_duration: 1500
    };
    timeline.push(trials_trial_2);

    var trials_trial_3 = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: '<div style="display:flex;flex-direction:column;align-items:center;gap:1.5em;padding:2em;box-sizing:border-box;width:1280px"><div style="font-size:22px;color:#dc2626;font-weight:bold">Incorrect answer. Please focus.</div></div>',
      choices: [" "],
      prompt: 'Press space to continue'
    };
    timeline.push(trials_trial_3);

    // ── Feedback (3/3) ──
    var feedback_trial_1 = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: '<div style="display:flex;flex-direction:column;align-items:center;gap:1.5em;padding:2em;box-sizing:border-box;width:1280px"><div style="font-size:22px;color:#1e293b;font-weight:bold">Experiment complete. Thank you for your participation!</div></div>',
      choices: [" "],
      prompt: 'Press a key'
    };
    timeline.push(feedback_trial_1);

    jsPsych.run(timeline);

  </script>
</body>
</html>
