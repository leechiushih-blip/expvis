<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExpVis Experiment</title>
  <!--
    Generated by ExpVis on 2026-09-14 | Device: Desktop
    Target: jsPsych v8.3.0
    Save this file and open it in a browser to run the experiment.
    Docs: https://www.jspsych.org
    Only the jsPsych plugins used by this experiment are loaded below.
  -->
  <script src="https://unpkg.com/jspsych@8.3.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.2.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@2.1.0"></script>
  <link href="https://unpkg.com/jspsych@8.3.0/css/jspsych.css" rel="stylesheet" type="text/css">
  <style>
.jspsych-display-element { min-height: 720px; }
  </style>
</head>
<body>
  <script>
    var jsPsych = initJsPsych({
      on_finish: function() {
        jsPsych.data.displayData();
      }
    });

    var timeline = [];

    // ── Instructions (1/3) ──
    var instructions_trial_1 = {
      type: jsPsychHtmlButtonResponse,
      stimulus: '<div style="display:flex;flex-direction:column;align-items:center;gap:1.5em;padding:2em;box-sizing:border-box;width:1280px"><div style="font-size:20px;color:#333333;font-weight:bold">Welcome to the Stroop experiment!<br><br>You will see color words (RED, BLUE, GREEN) displayed in different font colors.<br>Your task is to respond to the FONT COLOR, ignoring the word meaning.<br><br>Red font → Press A<br>Blue font → Press L<br>Green font → Press K<br><br>Respond as quickly and accurately as possible!</div></div>',
      choices: ["Start Experiment"],
      button_layout: 'grid',
      grid_rows: 1
    };
    timeline.push(instructions_trial_1);

    // ── Trials (2/3) ──
    // Stimulus variants for trials_trial_1
    var trials_trial_1_variants = [
      {stimulus: '<div style="font-size:36px;color:#ff0000;font-weight:bold">RED</div>', correct_response: "a"},
      {stimulus: '<div style="font-size:36px;color:#0000ff;font-weight:bold">RED</div>', correct_response: "l"},
      {stimulus: '<div style="font-size:36px;color:#00aa00;font-weight:bold">RED</div>', correct_response: "k"},
      {stimulus: '<div style="font-size:36px;color:#ff0000;font-weight:bold">BLUE</div>', correct_response: "a"},
      {stimulus: '<div style="font-size:36px;color:#0000ff;font-weight:bold">BLUE</div>', correct_response: "l"},
      {stimulus: '<div style="font-size:36px;color:#00aa00;font-weight:bold">BLUE</div>', correct_response: "k"},
      {stimulus: '<div style="font-size:36px;color:#ff0000;font-weight:bold">GREEN</div>', correct_response: "a"},
      {stimulus: '<div style="font-size:36px;color:#0000ff;font-weight:bold">GREEN</div>', correct_response: "l"},
      {stimulus: '<div style="font-size:36px;color:#00aa00;font-weight:bold">GREEN</div>', correct_response: "k"},
    ];

    var trials_trial_1 = {
      timeline_variables: trials_trial_1_variants,
      sample: {type: 'with-replacement', size: 1},
      repetitions: 48,
      timeline: [
        {
          type: jsPsychHtmlKeyboardResponse,
          stimulus: '<div style="display:flex;flex-direction:column;align-items:center;gap:1.5em;padding:2em;box-sizing:border-box;width:1280px"><div style="font-size:60px;color:#ccc">+</div></div>',
          choices: 'NO_KEYS',
          trial_duration: 700,
        },
        {
          type: jsPsychHtmlKeyboardResponse,
          stimulus: jsPsych.timelineVariable('stimulus'),
          choices: ["a","l","k"],
          prompt: 'Red→A  Blue→L  Green→K',
          data: {correct_response: jsPsych.timelineVariable('correct_response')},
          on_finish: function(data) {
            data.correct = jsPsych.pluginAPI.compareKeys(data.response, data.correct_response);
          }
        },
        {
          timeline: [{
            type: jsPsychHtmlButtonResponse,
            stimulus: '<div style="font-size:22px;color:#ef4444;font-weight:bold">Press the key for the FONT COLOR!<br>Red=A  Blue=L  Green=K</div>',
            choices: ["Continue"],
            trial_duration: 1200
          }],
          conditional_function: function () {
            return !jsPsych.data.get().last(1).values()[0].correct;
          }
        }
      ]
    };
    timeline.push(trials_trial_1);

    var trials_trial_2 = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: '<div style="display:flex;flex-direction:column;align-items:center;gap:1.5em;padding:2em;box-sizing:border-box;width:1280px"><div style="font-size:22px;color:#ef4444;font-weight:bold">Press the key for the FONT COLOR!<br>Red=A  Blue=L  Green=K</div></div>',
      trial_duration: 1200
    };
    timeline.push(trials_trial_2);

    // ── Feedback (3/3) ──
    var feedback_trial_1 = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: '<div style="display:flex;flex-direction:column;align-items:center;gap:1.5em;padding:2em;box-sizing:border-box;width:1280px"><div style="font-size:22px;color:#333333;font-weight:bold">Experiment complete!<br><br>Thank you for your participation.<br>Your response data has been recorded.</div></div>'
    };
    timeline.push(feedback_trial_1);

    jsPsych.run(timeline);

  </script>
</body>
</html>
