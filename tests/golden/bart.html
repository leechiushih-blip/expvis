<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExpVis Experiment</title>
  <!--
    Generated by ExpVis v1.0.0 on <DATE> | Device: Desktop
    Target: jsPsych v8.3.0
    Editor: https://github.com/leechiushih-blip/expvis (tag v1.0.0)
    Save this file and open it in a browser to run the experiment.
    Docs: https://www.jspsych.org
    Only the jsPsych plugins used by this experiment are loaded below.
  -->
  <script src="https://unpkg.com/jspsych@8.3.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@2.1.0"></script>
  <link href="https://unpkg.com/jspsych@8.3.0/css/jspsych.css" rel="stylesheet" type="text/css">
</head>
<body>
  <script>
    var jsPsych = initJsPsych({
      experiment_width: 1280,
      on_finish: function() {
        if (window.jatos) {
          jatos.submitResultData(jsPsych.data.get().csv())
            .then(function () { jatos.endStudy(); });
        } else {
          jsPsych.data.displayData();
          jsPsych.data.get().localSave('csv', 'experiment_' + Date.now() + '.csv');
        }
      }
    });

    var timeline = [];

    // ── Instructions (1/3) ──
    var instructions_trial_1 = {
      type: jsPsychHtmlButtonResponse,
      stimulus: '<div style="display:flex;flex-direction:column;align-items:center;gap:1.5em;padding:2em;box-sizing:border-box"><div style="font-size:20px;color:#333333;font-weight:bold">Balloon task<br><br>Pump the balloon to earn 5 points a pump.<br>Collect before it pops, or the balloon takes the points with it.</div></div>',
      choices: ["Start"],
      button_layout: 'grid',
      grid_rows: 1
    };

    var instructions_timeline = {
      timeline: [instructions_trial_1]
    };
    timeline.push(instructions_timeline);

    // ── Balloons (2/3) ──
    var balloons_trial_1 = {
      type: jsPsychHtmlButtonResponse,
      stimulus: function () {
          // A balloon still being pumped keeps its threshold; one that
          // ended starts the next draw. Drawn unguarded this would redraw
          // on every pump, and a balloon whose pop point moves is not a
          // balloon.
          var b = window.__bart;
          if (!b || b.state !== "pumping") {
            b = window.__bart = {
              threshold: 2 + Math.floor(Math.random() * 6),
              pumps: 0,
              state: "pumping"
            };
          }
          var w = 70 + b.pumps * 11, h = 90 + b.pumps * 16;
          return '<div style="text-align:center;font-family:sans-serif">' +
            '<div style="width:' + w + 'px;height:' + h + 'px;' +
            'background:#e11d48;border-radius:50%;margin:24px auto"></div>' +
            '<div style="font-size:20px;font-weight:600">' +
            b.pumps + ' pumps</div></div>';
        },
      choices: ["Pump","Collect"],
      button_layout: 'grid',
      grid_rows: 1,
      on_finish: function (data) {
          var b = window.__bart;
          if (data.response === 1) {
            b.state = "collected";
            data.points = b.pumps * 5;
          } else {
            b.pumps += 1;
            if (b.pumps >= b.threshold) { b.state = "popped"; data.points = 0; }
          }
          data.pumps_total = b.pumps;
          data.popped = b.state === "popped";
          data.threshold = b.threshold;
          // What the loop below reads: it can only see the trial that just
          // finished, so the decision has to be written onto that row.
          data.keep_pumping = b.state === "pumping";
        }
    };

    var balloons_timeline = {
      timeline: [balloons_trial_1],
      repetitions: 5,
      loop_function: function (data) {
        var last = data.last(1).values()[0];
        return !(last && last.keep_pumping === false);
      }
    };
    timeline.push(balloons_timeline);

    // ── Done (3/3) ──
    var done_trial_1 = {
      type: jsPsychHtmlButtonResponse,
      stimulus: '<div style="display:flex;flex-direction:column;align-items:center;gap:1.5em;padding:2em;box-sizing:border-box"><div style="font-size:20px;color:#333333;font-weight:bold">Thank you — that is the end of the task.</div></div>',
      choices: ["Finish"],
      button_layout: 'grid',
      grid_rows: 1
    };

    var done_timeline = {
      timeline: [done_trial_1]
    };
    timeline.push(done_timeline);

    jsPsych.run(timeline);

  </script>
</body>
</html>
