<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExpVis Experiment</title>
  <!--
    Generated by ExpVis v1.0 on 2026-09-21 | Device: Desktop
    Target: jsPsych v8.3.0
    Editor: https://github.com/leechiushih-blip/expvis (tag v1.0)
    Save this file and open it in a browser to run the experiment.
    Docs: https://www.jspsych.org
    Only the jsPsych plugins used by this experiment are loaded below.
  -->
  <script src="https://unpkg.com/jspsych@8.3.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.2.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@2.1.0"></script>
  <link href="https://unpkg.com/jspsych@8.3.0/css/jspsych.css" rel="stylesheet" type="text/css">
</head>
<body>
  <script>
    var jsPsych = initJsPsych({
      experiment_width: 1280,
      on_finish: function() {
        if (window.jatos) {
          jatos.submitResultData(jsPsych.data.get().csv())
            .then(function () { jatos.endStudy(); });
        } else {
          jsPsych.data.displayData();
          jsPsych.data.get().localSave('csv', 'experiment_' + Date.now() + '.csv');
        }
      }
    });

    var timeline = [];

    // ── Instructions (1/4) ──
    var instructions_trial_1 = {
      type: jsPsychHtmlButtonResponse,
      stimulus: '<div style="display:flex;flex-direction:column;align-items:center;gap:1.5em;padding:2em;box-sizing:border-box"><div style="font-size:20px;color:#333333;font-weight:bold">Consent<br><br>This demonstrates a run that goes one of two ways.<br><br>Press Y if you agree to take part, N if you do not. The rest of the study depends on which you press.</div></div>',
      choices: ["Start"],
      button_layout: 'grid',
      grid_rows: 1
    };

    var instructions_timeline = {
      timeline: [instructions_trial_1]
    };
    timeline.push(instructions_timeline);

    // ── Question (2/4) ──
    var question_trial_1 = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: '<div style="display:flex;flex-direction:column;align-items:center;gap:1.5em;padding:2em;box-sizing:border-box"><div style="font-size:30px;color:#333333;font-weight:bold">Do you agree to take part?</div></div>',
      choices: ["y","n"],
      prompt: 'Y or N',
      data: {correct_response: 'y'},
      on_finish: function(data) {
        data.correct = jsPsych.pluginAPI.compareKeys(data.response, data.correct_response);
      }
    };

    var question_timeline = {
      timeline: [question_trial_1]
    };
    timeline.push(question_timeline);

    // ── Agreed (3/4) ──
    var agreed_trial_1 = {
      type: jsPsychHtmlButtonResponse,
      stimulus: '<div style="display:flex;flex-direction:column;align-items:center;gap:1.5em;padding:2em;box-sizing:border-box"><div style="font-size:24px;color:#333333;font-weight:bold">Thank you for agreeing.<br><br>The study would carry on here.</div></div>',
      choices: ["Continue"],
      button_layout: 'grid',
      grid_rows: 1
    };

    var agreed_timeline = {
      timeline: [agreed_trial_1],
      conditional_function: function () {
        var last = jsPsych.data.get().last(1).values()[0];
        return (last && last.correct === true);
      }
    };
    timeline.push(agreed_timeline);

    // ── Declined (4/4) ──
    var declined_trial_1 = {
      type: jsPsychHtmlButtonResponse,
      stimulus: '<div style="display:flex;flex-direction:column;align-items:center;gap:1.5em;padding:2em;box-sizing:border-box"><div style="font-size:24px;color:#333333;font-weight:bold">Thank you for your time.<br><br>You may close this window.</div></div>',
      choices: ["Continue"],
      button_layout: 'grid',
      grid_rows: 1
    };

    var declined_timeline = {
      timeline: [declined_trial_1],
      conditional_function: function () {
        var last = jsPsych.data.get().last(1).values()[0];
        return (last && last.correct === false);
      }
    };
    timeline.push(declined_timeline);

    jsPsych.run(timeline);

  </script>
</body>
</html>
