<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExpVis Experiment</title>
  <!--
    Generated by ExpVis v1.0.0 on 2026-09-21 | Device: Desktop
    Target: jsPsych v8.3.0
    Editor: https://github.com/leechiushih-blip/expvis (tag v1.0.0)
    Save this file and open it in a browser to run the experiment.
    Docs: https://www.jspsych.org
    Only the jsPsych plugins used by this experiment are loaded below.
  -->
  <script src="https://unpkg.com/jspsych@8.3.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@2.1.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-text@2.1.1"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-likert@2.2.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-multi-choice@2.2.1"></script>
  <link href="https://unpkg.com/jspsych@8.3.0/css/jspsych.css" rel="stylesheet" type="text/css">
</head>
<body>
  <script>
    var jsPsych = initJsPsych({
      experiment_width: 1280,
      on_finish: function() {
        if (window.jatos) {
          jatos.submitResultData(jsPsych.data.get().csv())
            .then(function () { jatos.endStudy(); });
        } else {
          jsPsych.data.displayData();
          jsPsych.data.get().localSave('csv', 'experiment_' + Date.now() + '.csv');
        }
      }
    });

    var timeline = [];

    // ── Instructions (1/2) ──
    var instructions_trial_1 = {
      type: jsPsychHtmlButtonResponse,
      stimulus: '<div style="display:flex;flex-direction:column;align-items:center;gap:1.5em;padding:2em;box-sizing:border-box"><div style="font-size:20px;color:#333333;font-weight:bold">Questionnaire<br><br>Three short questions, one screen each.</div></div>',
      choices: ["Start"],
      button_layout: 'grid',
      grid_rows: 1
    };

    var instructions_timeline = {
      timeline: [instructions_trial_1]
    };
    timeline.push(instructions_timeline);

    // ── Questions (2/2) ──
    var questions_trial_1 = {
      type: jsPsychSurveyLikert,
      preamble: '',
      questions: [
        { prompt: 'The instructions were clear.', labels: ['Strongly disagree', 'Disagree', 'Neutral', 'Agree', 'Strongly agree'], name: 'Q0', required: true },
      ],
      button_label: 'Continue'
    };

    var questions_trial_2 = {
      type: jsPsychSurveyMultiChoice,
      preamble: '',
      questions: [
        { prompt: 'Which device did you use?', options: ['Phone', 'Tablet', 'Laptop', 'Desktop'], name: 'Q0', required: true },
      ],
      button_label: 'Continue'
    };

    var questions_trial_3 = {
      type: jsPsychSurveyText,
      preamble: '',
      questions: [
        { prompt: 'Anything you would like to add?', name: 'Q0' },
      ],
      button_label: 'Finish'
    };

    var questions_timeline = {
      timeline: [questions_trial_1, questions_trial_2, questions_trial_3]
    };
    timeline.push(questions_timeline);

    jsPsych.run(timeline);

  </script>
</body>
</html>
