<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExpVis Experiment</title>
  <!--
    Generated by ExpVis v1.0.0 on <DATE> | Device: Desktop
    Target: jsPsych v8.3.0
    Editor: https://github.com/leechiushih-blip/expvis (tag v1.0.0)
    Save this file and open it in a browser to run the experiment.
    Docs: https://www.jspsych.org
    Only the jsPsych plugins used by this experiment are loaded below.
  -->
  <script src="https://unpkg.com/jspsych@8.3.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@2.1.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-categorize-html@2.1.0"></script>
  <link href="https://unpkg.com/jspsych@8.3.0/css/jspsych.css" rel="stylesheet" type="text/css">
</head>
<body>
  <script>
    var jsPsych = initJsPsych({
      experiment_width: 1280,
      on_finish: function() {
        if (window.jatos) {
          jatos.submitResultData(jsPsych.data.get().csv())
            .then(function () { jatos.endStudy(); });
        } else {
          jsPsych.data.displayData();
          jsPsych.data.get().localSave('csv', 'experiment_' + Date.now() + '.csv');
        }
      }
    });

    var timeline = [];

    // ── Instructions (1/3) ──
    var instructions_trial_1 = {
      type: jsPsychHtmlButtonResponse,
      stimulus: '<div style="display:flex;flex-direction:column;align-items:center;gap:1.5em;padding:2em;box-sizing:border-box"><div style="font-size:20px;color:#333333;font-weight:bold">Simon task<br><br>A circle appears on the left or the right. Answer the COLOUR and ignore the side it is on.<br><br>Red → A     Green → L</div></div>',
      choices: ["Start"],
      button_layout: 'grid',
      grid_rows: 1
    };

    var instructions_timeline = {
      timeline: [instructions_trial_1]
    };
    timeline.push(instructions_timeline);

    // ── Trials (2/3) ──
    // The same procedure once per set of values below.
    var trials_variables = [
      {stimulus: '<div style="display:flex;flex-direction:column;align-items:center;gap:1.5em;padding:2em;box-sizing:border-box"><div style="align-self:flex-start;text-align:left;width:90px;height:90px;background:#ef4444;border-radius:50%"></div></div>', key_answer: 'a'},
      {stimulus: '<div style="display:flex;flex-direction:column;align-items:center;gap:1.5em;padding:2em;box-sizing:border-box"><div style="align-self:flex-end;text-align:right;width:90px;height:90px;background:#ef4444;border-radius:50%"></div></div>', key_answer: 'a'},
      {stimulus: '<div style="display:flex;flex-direction:column;align-items:center;gap:1.5em;padding:2em;box-sizing:border-box"><div style="align-self:flex-start;text-align:left;width:90px;height:90px;background:#22c55e;border-radius:50%"></div></div>', key_answer: 'l'},
      {stimulus: '<div style="display:flex;flex-direction:column;align-items:center;gap:1.5em;padding:2em;box-sizing:border-box"><div style="align-self:flex-end;text-align:right;width:90px;height:90px;background:#22c55e;border-radius:50%"></div></div>', key_answer: 'l'}
    ];

    var trials_timeline = {
      timeline: [
        {
          type: jsPsychCategorizeHtml,
          stimulus: jsPsych.timelineVariable('stimulus'),
          choices: ["a","l"],
          key_answer: jsPsych.timelineVariable('key_answer'),
          correct_text: 'Correct!',
          incorrect_text: 'That was the wrong colour.'
        }
      ],
      timeline_variables: trials_variables,
      randomize_order: true,
      repetitions: 40
    };
    timeline.push(trials_timeline);

    // ── Done (3/3) ──
    var done_trial_1 = {
      type: jsPsychHtmlButtonResponse,
      stimulus: '<div style="display:flex;flex-direction:column;align-items:center;gap:1.5em;padding:2em;box-sizing:border-box"><div style="font-size:20px;color:#333333;font-weight:bold">Thank you — that is the end of the task.</div></div>',
      choices: ["Finish"],
      button_layout: 'grid',
      grid_rows: 1
    };

    var done_timeline = {
      timeline: [done_trial_1]
    };
    timeline.push(done_timeline);

    jsPsych.run(timeline);

  </script>
</body>
</html>
