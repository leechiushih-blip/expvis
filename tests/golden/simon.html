<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExpVis Experiment</title>
  <!--
    Generated by ExpVis on 2026-09-14 | Device: Desktop
    Target: jsPsych v8.3.0
    Save this file and open it in a browser to run the experiment.
    Docs: https://www.jspsych.org
    Only the jsPsych plugins used by this experiment are loaded below.
  -->
  <script src="https://unpkg.com/jspsych@8.3.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.2.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@2.1.0"></script>
  <link href="https://unpkg.com/jspsych@8.3.0/css/jspsych.css" rel="stylesheet" type="text/css">
  <style>
.jspsych-display-element { min-height: 720px; }
  </style>
</head>
<body>
  <script>
    var jsPsych = initJsPsych({
      on_finish: function() {
        jsPsych.data.displayData();
      }
    });

    var timeline = [];

    // ── Instructions (1/3) ──
    var instructions_trial_1 = {
      type: jsPsychHtmlButtonResponse,
      stimulus: '<div style="display:flex;flex-direction:column;align-items:center;gap:1.5em;padding:2em;box-sizing:border-box;width:1280px"><div style="font-size:20px;color:#333333;font-weight:bold">Welcome to the Simon effect experiment!<br><br>Colored circles will appear on the left or right side of the screen.<br>Ignore the position and respond based on COLOR:<br><br>Red → Press A<br>Green → Press L<br><br>Respond as quickly and accurately as possible!</div></div>',
      choices: ["Start Experiment"],
      button_layout: 'grid',
      grid_rows: 1
    };
    timeline.push(instructions_trial_1);

    // ── Trials (2/3) ──
    var trials_trial_1 = {
      timeline: [
        {
          type: jsPsychHtmlKeyboardResponse,
          stimulus: '<div style="display:flex;flex-direction:column;align-items:center;gap:1.5em;padding:2em;box-sizing:border-box;width:1280px"><div style="font-size:60px;color:#ccc">+</div></div>',
          choices: 'NO_KEYS',
          trial_duration: 700,
        },
        {
          type: jsPsychHtmlKeyboardResponse,
          stimulus: '<div style="display:flex;flex-direction:column;align-items:center;gap:1.5em;padding:2em;box-sizing:border-box;width:1280px"><div style="width:80px;height:80px;background:#6366f1;border-radius:50%"></div><div style="width:80px;height:80px;background:#ef4444;border-radius:50%"></div><div style="width:80px;height:80px;background:#ef4444;border-radius:50%"></div><div style="width:80px;height:80px;background:#22c55e;border-radius:50%"></div></div>',
          choices: ["a","l"],
          prompt: 'Press a key'
        }
      ]
    };
    timeline.push(trials_trial_1);

    var trials_trial_2 = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: '<div style="display:flex;flex-direction:column;align-items:center;gap:1.5em;padding:2em;box-sizing:border-box;width:1280px"><div style="font-size:22px;color:#ef4444;font-weight:bold">Press the key for the COLOR!<br>Red=A  Green=L</div></div>',
      trial_duration: 1200
    };
    timeline.push(trials_trial_2);

    // ── Feedback (3/3) ──
    var feedback_trial_1 = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: '<div style="display:flex;flex-direction:column;align-items:center;gap:1.5em;padding:2em;box-sizing:border-box;width:1280px"><div style="font-size:24px;color:#333333;font-weight:bold">Experiment complete!<br><br>Thank you for your participation.<br>Your reaction time and accuracy have been recorded.</div></div>'
    };
    timeline.push(feedback_trial_1);

    jsPsych.run(timeline);

  </script>
</body>
</html>
